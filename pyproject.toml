[project]
name = "dramatiq-scatter-gather-demo"
version = "0.1.0"
description = "Distributed scatter-gather demo using dramatiq group callbacks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Christopher Deutsch" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "dramatiq[redis]>=2.2.1",
]

[project.scripts]
send = "dramatiq_scatter_gather_demo.send:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff.lint]
extend-select = ["I"]
